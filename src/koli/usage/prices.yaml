# usage/prices.yaml
# What each online model costs, in USD, from the providers' pricing pages on
# 2026-10-28 (standard tier, prompts under 200k tokens). A `prices.yaml` in
# the settings folder is laid over this one, entry by entry (Usage screen ›
# Prices), so a price change never needs a new Koli.
#
# Per model ("provider/model"):
#   transcribe   upload: send a recording, get text (usable now)
#                live:   a live stream over WebSocket (listed, coming next)
#                absent: a text-only model (summaries, chat, polish)
#   per_minute   price per minute of audio
#   audio_in     price per 1M audio tokens in
#   text_in      price per 1M text tokens in
#   text_out     price per 1M text tokens out (thinking tokens count here)
#   changes      later prices: [{from: YYYY-MM-DD, <field>: price, ...}]
#   note         shown beside the model
# A call is priced by its tokens when the answer gives them and the model has
# token prices, else by the minute.

# Gemini counts 25 tokens per second of audio (the pricing page's footnote).
gemini_audio_tokens_per_second: 25

models:
  # ── OpenAI: transcription ──────────────────────────────────────────────────
  openai/gpt-transcribe: {transcribe: upload, per_minute: 0.0045}
  openai/gpt-4o-transcribe: {transcribe: upload, per_minute: 0.006, audio_in: 2.50, text_in: 2.50, text_out: 10.00}
  openai/gpt-4o-mini-transcribe: {transcribe: upload, per_minute: 0.003, audio_in: 1.25, text_in: 1.25, text_out: 5.00}
  openai/gpt-4o-transcribe-diarize: {transcribe: upload, per_minute: 0.006, audio_in: 2.50, text_in: 2.50, text_out: 10.00,
                                     note: Also tells speakers apart}
  openai/whisper-1: {transcribe: upload, per_minute: 0.006, note: Gives per-sentence certainty like local Whisper}
  openai/gpt-live-transcribe: {transcribe: live, per_minute: 0.017}
  openai/gpt-realtime-whisper: {transcribe: live, per_minute: 0.017}
  openai/gpt-audio: {transcribe: live, audio_in: 32.00, text_in: 2.50, text_out: 10.00, note: Chat model that hears audio}
