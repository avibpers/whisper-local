  openai/gpt-audio-mini: {transcribe: live, audio_in: 10.00, text_in: 0.60, text_out: 2.40, note: Chat model that hears audio}
  openai/gpt-realtime: {transcribe: live, audio_in: 32.00, text_in: 4.00, text_out: 16.00}
