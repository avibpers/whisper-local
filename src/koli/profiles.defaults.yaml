# Koli — Profiles
#
# A profile holds only what it changes, on top of your global settings, which it
# never overwrites. Everything else is "use global". Three things choose one, first
# that applies: holding its `hotkey`, the profile set on the app's rule, the active
# profile (the default for the whole system, in the tray and the app window).
#
# It can set what can change from one dictation to the next (settings/schema.py,
# PROFILE_PATHS), not the speech model or the microphone.

active: dictation

profiles:
  dictation:
    description: Your global settings as they are
    overrides: {}

  chat:
    description: Pastes right away, for chat apps
    overrides:
      clipboard:
        auto_paste: true
        delivery_method: paste

  code:
    description: Copies only, never pastes, for editors
    overrides:
      clipboard:
        auto_paste: false

  notes:
    description: Copies only, for note-taking
    overrides:
      clipboard:
        auto_paste: false

  translate:
    description: Speak Hebrew, write English
    hotkey: "ctrl+win+y | macos: ctrl+option+t"
    overrides:
      ai:
        translate: he_en
