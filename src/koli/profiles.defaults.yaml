# Koli — Profiles
#
# Each profile defines overrides applied to user_settings.yaml when the
# profile is activated from the system tray "Profile" submenu.
#
# Sections that can be overridden: any top-level key in config.defaults.yaml
# (whisper, hotkey, vad, audio, clipboard, voice_commands, auto_dictation, ...).
# For example, a profile can start listening whenever a text field gets focus:
#   overrides:
#     auto_dictation:
#       enabled: true

active: dictation

profiles:
  dictation:
    description: General-purpose voice typing
    overrides:
      clipboard:
        auto_paste: true
        delivery_method: paste
      whisper:
        task: transcribe
        initial_prompt: ""
      voice_commands:
        enabled: true

  chat:
    description: Hold-to-talk for chat apps; auto-send on Alt
    overrides:
      hotkey:
        recording_mode: push_to_talk
      clipboard:
        auto_paste: true
        delivery_method: paste
      whisper:
        task: transcribe
        initial_prompt: ""

  code:
    description: Copy-only mode for editors; never auto-send
    overrides:
      clipboard:
        auto_paste: false
        delivery_method: paste
      whisper:
        task: transcribe
        initial_prompt: ""
      voice_commands:
        enabled: true

  notes:
    description: Quiet copy-to-clipboard mode for note-taking
    overrides:
      clipboard:
        auto_paste: false
      whisper:
        task: transcribe
        initial_prompt: ""
      voice_commands:
        enabled: false

  translate:
    description: Translate any spoken language into English
    overrides:
      whisper:
        task: translate
        language: auto
      clipboard:
        auto_paste: true
